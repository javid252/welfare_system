# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy this whole project with one click:
#   1. Push this repo to GitHub.
#   2. On Render: New -> Blueprint -> select this repo.
# Render reads this file and provisions both services below automatically,
# already wired together (DATABASE_URL is injected into the web service from
# the database's connection string — no manual copy/paste needed).

databases:
  - name: welfare-system-db
    plan: free
    databaseName: welfare_system
    user: welfare_system

services:
  - type: web
    name: welfare-system
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn welfare_system.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: welfare-system-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"
